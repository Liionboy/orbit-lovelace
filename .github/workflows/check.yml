name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: git diff --exit-code -- dist/orbit-lovelace.js bundle-lock.json themes/orbit-themes.yaml themes/catalog.json
      - run: npm run check
      - run: npm test
